name: Claude Code

# `@claude` in an issue or PR comment. The steps and rules live in gyankosh-core.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    uses: gyankosh-ca/gyankosh-core/.github/workflows/claude.yml@main
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    with:
      checks: "the checks AGENTS.md names"
      base: main
